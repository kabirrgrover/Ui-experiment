<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:var(--paper)}
  .wrap{position:relative;width:960px;height:300px;overflow:hidden}
  svg{position:absolute;inset:0}
  .safety{fill:var(--safety)} .hazard{fill:var(--yellow)} .blue{fill:var(--blue)} .survey{fill:var(--green)} .sticky{fill:var(--pink)}
  .tick{stroke:var(--ink);stroke-width:var(--stroke-ink);stroke-linecap:round}
  .r-l{rx:var(--radius-l)} .r-m{rx:var(--radius-m)}
  .name{position:absolute;left:40px;bottom:64px;max-width:440px;margin:0;font:400 64px/.95 var(--font-display);color:var(--ink)}
  .tag{position:absolute;left:42px;bottom:32px;max-width:440px;margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
</style></head>
<body>
<div class="wrap">
  <!-- blocks: safety slab 160x300 bleeding top, yellow tape 320x72, blue 192x152 radius-l, green pill 96x48, pink 88x88 radius-m
       arrangement: one tall slab with satellites, tape bleeding off the right edge
       pattern: tape-measure ticks every space-2 (8px), long tick every 5th; chosen because the measuring tape is the system's own "measure twice, draft once" motif
       steps/radii: space-2 pitch, space-6 gaps, radius-l, radius-m, pill = half of 48 -->
  <svg width="960" height="300" viewBox="0 0 960 300">
    <rect class="safety" x="480" y="-20" width="160" height="320"/>
    <rect class="hazard" x="664" y="40" width="320" height="72"/>
    <g>
      <line class="tick" x1="672" y1="112" x2="672" y2="88"/><line class="tick" x1="680" y1="112" x2="680" y2="100"/><line class="tick" x1="688" y1="112" x2="688" y2="100"/><line class="tick" x1="696" y1="112" x2="696" y2="100"/><line class="tick" x1="704" y1="112" x2="704" y2="100"/>
      <line class="tick" x1="712" y1="112" x2="712" y2="88"/><line class="tick" x1="720" y1="112" x2="720" y2="100"/><line class="tick" x1="728" y1="112" x2="728" y2="100"/><line class="tick" x1="736" y1="112" x2="736" y2="100"/><line class="tick" x1="744" y1="112" x2="744" y2="100"/>
      <line class="tick" x1="752" y1="112" x2="752" y2="88"/><line class="tick" x1="760" y1="112" x2="760" y2="100"/><line class="tick" x1="768" y1="112" x2="768" y2="100"/><line class="tick" x1="776" y1="112" x2="776" y2="100"/><line class="tick" x1="784" y1="112" x2="784" y2="100"/>
      <line class="tick" x1="792" y1="112" x2="792" y2="88"/><line class="tick" x1="800" y1="112" x2="800" y2="100"/><line class="tick" x1="808" y1="112" x2="808" y2="100"/><line class="tick" x1="816" y1="112" x2="816" y2="100"/><line class="tick" x1="824" y1="112" x2="824" y2="100"/>
      <line class="tick" x1="832" y1="112" x2="832" y2="88"/><line class="tick" x1="840" y1="112" x2="840" y2="100"/><line class="tick" x1="848" y1="112" x2="848" y2="100"/><line class="tick" x1="856" y1="112" x2="856" y2="100"/><line class="tick" x1="864" y1="112" x2="864" y2="100"/>
      <line class="tick" x1="872" y1="112" x2="872" y2="88"/><line class="tick" x1="880" y1="112" x2="880" y2="100"/><line class="tick" x1="888" y1="112" x2="888" y2="100"/><line class="tick" x1="896" y1="112" x2="896" y2="100"/><line class="tick" x1="904" y1="112" x2="904" y2="100"/>
      <line class="tick" x1="912" y1="112" x2="912" y2="88"/><line class="tick" x1="920" y1="112" x2="920" y2="100"/><line class="tick" x1="928" y1="112" x2="928" y2="100"/><line class="tick" x1="936" y1="112" x2="936" y2="100"/><line class="tick" x1="944" y1="112" x2="944" y2="100"/><line class="tick" x1="952" y1="112" x2="952" y2="88"/>
    </g>
    <rect class="blue r-l" x="664" y="136" width="192" height="152"/>
    <rect class="survey" x="880" y="136" width="96" height="48" rx="24"/>
    <rect class="sticky r-m" x="880" y="208" width="88" height="88"/>
  </svg>
  <h1 class="name">AI Docbuilder</h1>
  <p class="tag">White page, black ink, happy stickers. Drafting site documents.</p>
</div>
</body></html>
