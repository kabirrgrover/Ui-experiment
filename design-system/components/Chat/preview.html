<!-- @dsCard group="Chat" height=520 subtitle="AI asks one question at a time, composer below" -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body class="db-page" style="margin:0;padding:24px">
  <div class="db-chat">
    <div class="db-msg db-msg--ai">
      <div class="db-msg__who">docbuilder</div>
      Let's put together your geotech service requisition. I'll ask a few questions, then draft it for you to mark up.
      <span class="db-msg__aside">about 6 questions, skip any</span>
    </div>
    <div class="db-question">
      <div class="db-question__step">Question 2 of 6 · Site</div>
      <h4>what's the expected soil class?</h4>
      <div class="db-question__opts"><button class="db-chip">Class C</button><button class="db-chip" aria-pressed="true">Class D</button><button class="db-chip">Not sure yet</button></div>
    </div>
    <div class="db-msg db-msg--user">Class D, and we'll need 3 boreholes near the tower crane footing.</div>
    <div class="db-composer"><textarea rows="1" placeholder="Answer, or ask me to change something..." aria-label="Message"></textarea><button class="db-btn db-btn--primary">Send</button></div>
  </div>
</body></html>
