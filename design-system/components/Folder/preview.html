<!-- @dsCard group="Library" height=300 subtitle="Pastel folders with documents peeking out" -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body class="db-page" style="margin:0;padding:32px;display:flex;gap:40px;align-items:flex-start">
  <button class="db-folder" data-color="pink">
    <span class="db-folder__body"><span class="db-folder__back"></span>
      <span class="db-folder__items">
        <span style="left:4px;width:70px;height:92px;background:#fff;border:1px solid var(--rule);transform:rotate(-8deg)"></span>
        <span style="left:58px;width:76px;height:100px;background:var(--sticky-yellow)"></span>
        <span style="left:104px;width:56px;height:80px;background:var(--safety);transform:rotate(9deg)"></span>
      </span><span class="db-folder__front"></span></span>
    <span class="db-folder__label">Service Req.</span><span class="db-folder__count">12 documents</span>
  </button>
  <button class="db-folder" data-color="sage">
    <span class="db-folder__body"><span class="db-folder__back"></span>
      <span class="db-folder__items">
        <span style="left:10px;width:80px;height:96px;background:#fff;border:1px solid var(--rule);transform:rotate(-4deg)"></span>
        <span style="left:84px;width:68px;height:88px;background:var(--blue);transform:rotate(6deg)"></span>
      </span><span class="db-folder__front"></span></span>
    <span class="db-folder__label">Material Req.</span><span class="db-folder__count">7 documents</span>
  </button>
  <button class="db-folder" data-color="butter">
    <span class="db-folder__body"><span class="db-folder__back"></span>
      <span class="db-folder__items">
        <span style="left:30px;width:90px;height:100px;background:#fff;border:1px solid var(--rule);transform:rotate(3deg)"></span>
      </span><span class="db-folder__front"></span></span>
    <span class="db-folder__label">Execution Plans</span><span class="db-folder__count">3 documents</span>
  </button>
</body></html>
